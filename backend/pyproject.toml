[project]
name = "where-is-the-money"
version = "0.1.0"
description = "Pipeline pessoal de ingestão e análise de gastos via Open Finance (Pluggy)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
