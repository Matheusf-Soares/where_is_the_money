[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "where-is-the-money"
version = "0.1.0"
description = "Pipeline pessoal de ingestão e análise de gastos via Open Finance (Pluggy)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Atalho: `financas ingerir` em vez de `python -m financas ingerir`.
[project.scripts]
financas = "financas.cli:main_console"

# Layout src explícito. A descoberta automática do setuptools acertaria isto
# sozinha, mas declarar evita que ela mude de ideia ao encontrar `dados/`,
# `config/` ou `sql/` na raiz do backend.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# ATENÇÃO: isto vale só para o pytest. Não é o que põe `financas` no path do
# `python -m` — para isso é preciso `pip install -e .` a partir de `backend/`.
pythonpath = ["src"]
testpaths = ["tests"]
